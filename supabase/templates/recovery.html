<h2>Redefinição de senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no <strong>milafin</strong>.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha">Criar nova senha</a></p>
<p>Se você não fez esse pedido, ignore este e-mail. Sua senha continua a mesma.</p>
